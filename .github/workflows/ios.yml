name: iOS (FOFilter)

on:
  push:
    paths:
      - 'filter-app-ios/**'
      - 'filter-app-android/app/src/main/assets/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: filter-app-ios
    steps:
      - uses: actions/checkout@v4

      - name: Xcode
        run: xcodebuild -version

      - name: Xcode 프로젝트 만들기 (XcodeGen)
        run: |
          brew install xcodegen
          xcodegen generate

      - name: 유닛 테스트 (시뮬레이터)
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          c = sorted((k, v["udid"]) for k, l in d.items() if "iOS" in k for v in l if v["name"].startswith("iPhone"))
          print(c[-1][1])')
          echo "simulator $UDID"
          xcodebuild test -project FOFilter.xcodeproj -scheme FOFilter -destination "id=$UDID" \
            CODE_SIGNING_ALLOWED=NO -quiet

      - name: 서명 안 한 .ipa 만들기
        run: |
          xcodebuild build -project FOFilter.xcodeproj -scheme FOFilter -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" -quiet
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/FOFilter.app Payload/
          zip -qry FOFilter-unsigned.ipa Payload
          ls -la FOFilter-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: FOFilter-ios-unsigned
          path: filter-app-ios/FOFilter-unsigned.ipa
          retention-days: 30
