name: FOFilter
options:
  bundleIdPrefix: kr.co.jnkcorp
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  FOFilter:
    type: application
    platform: iOS
    sources:
      - path: FOFilter
      - path: Resources/Assets.xcassets
      # 안드로이드판과 같은 LUT·글꼴 파일을 그대로 씀
      - path: ../filter-app-android/app/src/main/assets/luts
        type: folder
        buildPhase: resources
      - path: ../filter-app-android/app/src/main/assets/fonts
        type: folder
        buildPhase: resources
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: FOFilter
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: 필터를 입힌 화면을 보면서 사진·영상을 찍기 위해 카메라를 씁니다.
        NSMicrophoneUsageDescription: 영상을 찍을 때 소리를 함께 녹음합니다.
        NSPhotoLibraryAddUsageDescription: 필터를 입힌 사진·영상을 사진 앱에 저장합니다.
        NSPhotoLibraryUsageDescription: ‘원본에 덮어쓰기’ 를 고르면 사진 앱의 원본을 편집본으로 바꿉니다 (사진 앱에서 되돌릴 수 있어요).
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.co.jnkcorp.fofilter
        PRODUCT_NAME: FOFilter
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: NO
  FOFilterTests:
    type: bundle.unit-test
    platform: iOS
    sources: [FOFilterTests]
    dependencies:
      - target: FOFilter
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: kr.co.jnkcorp.fofilter.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/FOFilter.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/FOFilter
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  FOFilter:
    build:
      targets:
        FOFilter: all
        FOFilterTests: [test]
    test:
      config: Debug
      targets: [FOFilterTests]
